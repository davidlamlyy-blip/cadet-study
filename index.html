<div class="app">
 <nav class="rail">
  <div class="pillbar" id="rail">
   <div class="logo">✈️</div>
   <button data-v="dash" title="Dashboard">🏠<span>Home</span></button>
   <button data-v="learn" class="on" title="學習路徑">📚<span>學習</span></button>
   <button data-v="cal" title="日曆／測驗">📅<span>日曆</span></button>
   <button data-v="notes" title="筆記">📝<span>Notes</span></button>
   <button data-v="map" title="地圖">🗺️<span>地圖</span></button>
   <button data-v="anim" title="動畫">🎬<span>動畫</span></button>
   <button data-v="cards" title="Flash card">🃏<span>Card</span></button>
   <button data-v="find" title="搜尋 ( / )">🔍<span>搜尋</span></button>
   <button data-v="set" title="設定" class="mobset">⚙️<span>設定</span></button>
  </div>
  <div class="gear"><button data-v="set" title="設定" style="background:none;border:0;color:#fff;font-size:20px;cursor:pointer;width:46px;height:46px">⚙️</button></div>
 </nav>
 <aside class="side" id="side"></aside>
 <div class="bdrop" id="bdrop"></div>
 <div class="mainp">
  <div class="mh">
   <button class="tab" id="menuBtn" aria-label="目錄">☰ 目錄</button>
   <div class="tt"><h1 id="vt">Cadet</h1><div class="sub" id="vs"></div></div>
   <div class="sbox"><input id="q" type="search" placeholder="搜尋 topic／card 問題  ( / )" autocomplete="off"><div id="sres"></div></div>
  </div>
  <div id="loading"><i></i>載入緊…</div>
  <div class="tabsx" id="ctxTabs" style="display:none"></div>
  <section id="v-notes" class="view"></section>
  <section id="v-learn" class="view"></section>
  <section id="v-dash" class="view"></section>
  <section id="v-cal" class="view"></section>
  <section id="v-skipped" class="view"></section>
  <section id="v-map" class="view on">
   <div class="mapbar"><div class="crumb" id="crumb"></div><div id="mapmode"></div></div>
   <div class="mapwrap">
    <div id="mapcol"><div id="mapbox"><svg id="map" viewBox="0 0 700 700"></svg><div class="zoomctl" id="zoomctl"><button data-z="1.4" aria-label="放大">＋</button><button data-z="0.7" aria-label="縮小">－</button><button data-z="0" aria-label="重設">⟲</button></div></div><div id="lst"></div><div class="legend" id="legend"></div></div>
    <div id="info"><button class="xbtn" id="xinfo" aria-label="關閉">✕</button><div id="infoc"></div></div>
   </div>
  </section>
  <section id="v-anim" class="view">
   <div class="toolbar"><input id="aq" type="search" placeholder="搜尋動畫（標題／科目／提示）"><button class="b g" id="aall">全部展開</button><button class="b g" id="aone">全部摺埋</button></div>
   <div id="animList"></div>
  </section>
  <section id="v-cards" class="view">
   <div class="deckbar" id="deckbar"></div>
   <div class="dopt"><select id="topicSel" aria-label="Topic 篩選"></select><label class="sw"><input type="checkbox" id="onlyUnk" checked> Smart review (due first)</label><label class="sw"><input type="checkbox" id="onlyLearned" checked> Learned topics only</label></div>
   <div class="stats"><div class="bar"><i id="prog"></i></div><div class="small" id="count"></div><div class="small" id="daily"></div></div>
   <div id="cardArea"></div>
   <div class="row" id="cardBtns"><button class="b g" id="again">😵 Don't know (←)</button><button class="b" id="know">✅ Know (→)</button><button class="b" id="easy" style="background:#58cc02;color:#fff">⚡ Easy (↑)</button><button class="b g" id="undoc" disabled title="撤回上一張（Cmd/Ctrl+Z）">↶ Undo (⌘Z)</button><button class="b g" id="skipc" title="呢張唔需要識，以後唔再出">⏭ Skip（唔需要）(S)</button></div>
   <div class="row" style="margin-top:8px"><button class="b g" data-v2go="skipped" id="skipLink">🗂 已跳過嘅 card</button></div>
   <div class="kbd">Space flip · ← Don't know · → Know · ↑ Easy · S Skip（唔需要，唔再出）· ⌘/Ctrl+Z 撤回上一張 · Mobile: swipe left/right</div>
  </section>
  <section id="v-set" class="view"></section>
  <div class="disc">Unofficial personal study notes — may contain errors. Always verify with official manuals / regulations. Not for flight operations.</div>
 </div>
</div>
<div id="ovl"><div class="panel"><div class="ohead"><div><b id="ot" style="font-size:19px"></b><div class="small" id="oh"></div></div><button class="b g" id="oc">✕ 關閉</button></div><div class="abox" id="obox"></div></div></div>
